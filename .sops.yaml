# destinataires age. ce fichier n est pas importe par le flake :
# aucun secret n est declare, l evaluation ne depend pas d un .yaml chiffre.
#
# TODO: remplacer chaque placeholder par la cle publique (age1...), jamais la cle privee.
#   utilisateur :
#     age-keygen -y ~/.config/sops/age/keys.txt
#   sur navi, sur games, et sur sommei, en root, apres creation de la cle d hote :
#     age-keygen -y /var/lib/sops-nix/key.txt
keys:
  - &user TODO_USER
  - &navi TODO_NAVI
  - &games TODO_GAMES
  - &sommei TODO_SOMMEI

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *user
          - *navi
          - *games
          - *sommei
